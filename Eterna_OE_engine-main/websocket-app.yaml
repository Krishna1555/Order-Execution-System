# App Engine Configuration for WebSocket Service (Standard Environment)
# WARNING: App Engine Standard does NOT natively support WebSockets
# Consider using App Engine Flexible or Cloud Run for WebSocket support
# This service will run but WebSocket connections may not work properly

runtime: nodejs22

service: websocket-service

# Use service-specific entry point
entrypoint: node dist/servers/websocket-server.js

# Standard environment uses instance_class for memory allocation
instance_class: F1

automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.7
  min_pending_latency: 200ms
  max_pending_latency: automatic
  # Note: WebSocket connections are long-lived, but Standard may have limitations
  max_concurrent_requests: 10

# Cloud SQL instance connection (required for Unix socket provisioning)
# This tells App Engine Standard to provision the Unix socket at /cloudsql/INSTANCE_CONNECTION_NAME
beta_settings:
  cloud_sql_instances: eterna-oe-engine-483916:asia-south1:eterna-oe-engine-pg

# VPC Access Connector for Cloud Memorystore (private IP)
# Required for App Engine Standard to access Memorystore private IP (10.240.77.139)
# private-ranges-only: Routes private IPs through VPC, public IPs (like Supabase) go directly
vpc_access_connector:
  name: projects/eterna-oe-engine-483916/locations/asia-south1/connectors/eterna-oe-connector
  egress_setting: private-ranges-only

env_variables:
  SERVICE_TYPE: 'websocket'
  ENABLE_HTTP_SERVER: 'true'
  ENABLE_WEBSOCKET: 'true'
  ENABLE_WORKER: 'false'
  ENABLE_HEALTH: 'false'
  NODE_ENV: 'production'
  PORT: '8080'
  LOG_LEVEL: 'info'
  # Note: DATABASE_URL and REDIS_URL are loaded from .env file (included in deployment)
  # Solana configuration (not needed for WebSocket service, but kept for consistency)
  SOLANA_RPC_URL: 'https://api.mainnet-beta.solana.com'
  SOLANA_CLUSTER: 'mainnet-beta'
  DEVNET_ENABLED: 'true'
